  # 10 — SSR SMOKE. Opt-in (run-smoke-ssr). Boots the REAL built @astrojs/node standalone
  # server and crawls public routes over HTTP (routes discovered from the server's own
  # sitemap). Self-gated to Dependabot non-incident MAJORS; NOT a ruleset-required check;
  # enforced via dependabot-automerge.yml (an SSR site's gate polls `ci / smoke-ssr`). The crawl/
  # assert logic is the SAME smoke.mjs as the static smoke job, in `url` mode.
  smoke-ssr:
    name: smoke-ssr
    needs: [changes, setup]
    if: ${{ always() && inputs.run-smoke-ssr && github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # fetch-metadata (see lesson gha-reusable-workflow-permissions)
    defaults:
      run:
        working-directory: ${{ inputs.site-dir }}
    env:
      PUBLIC_SANITY_PROJECT_ID: ${{ inputs.public-sanity-project-id }}
      PUBLIC_SANITY_DATASET: ${{ inputs.public-sanity-dataset }}
      SITE_URL: ${{ inputs.site-url }}
    steps:
      - name: Skip (docs-only change)
        if: ${{ needs.changes.outputs.code == 'false' }}
        working-directory: ${{ github.workspace }}
        run: echo "Docs/.ai/markdown-only change — smoke-ssr not needed. Reporting success."
      - if: ${{ needs.changes.outputs.code != 'false' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - id: meta
        if: ${{ needs.changes.outputs.code != 'false' }}
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a  # v2.5.0
      # Self-gate: crawl ONLY for a MAJOR bump that is not the incident class. Otherwise this
      # job reports success without doing work (safe — smoke-ssr is not a required check).
      - name: Decide whether to crawl
        id: gate
        if: ${{ needs.changes.outputs.code != 'false' }}
        working-directory: ${{ github.workspace }}
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEP_NAMES: ${{ steps.meta.outputs.dependency-names }}
        run: |
          set -euo pipefail
          crawl=false
          if [ "$UPDATE_TYPE" = "version-update:semver-major" ]; then
            case "$DEP_NAMES" in
              *sanity*|*drizzle*|*postgres*|*better-auth*|*stripe*) crawl=false ;;
              *) crawl=true ;;
            esac
          fi
          echo "crawl=$crawl" >> "$GITHUB_OUTPUT"
          echo "update-type=$UPDATE_TYPE names=[$DEP_NAMES] -> crawl=$crawl"
      - if: ${{ needs.changes.outputs.code != 'false' && steps.gate.outputs.crawl == 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.site-dir }}/package-lock.json
      - if: ${{ needs.changes.outputs.code != 'false' && steps.gate.outputs.crawl == 'true' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ inputs.site-dir }}/node_modules
          key: ${{ needs.changes.outputs.cache-key }}
      - name: Install (cache-miss safety net)
        if: ${{ needs.changes.outputs.code != 'false' && steps.gate.outputs.crawl == 'true' }}
        run: '[ -d node_modules ] || npm ci --prefer-offline --no-audit --no-fund'
      - name: Build (deploy-faithful)
        if: ${{ needs.changes.outputs.code != 'false' && steps.gate.outputs.crawl == 'true' }}
        env:
          BUILD_SCRIPT: ${{ inputs.build-script }}
        run: npm run "$BUILD_SCRIPT"
      - name: Boot SSR server + smoke over HTTP (isolated Playwright)
        if: ${{ needs.changes.outputs.code != 'false' && steps.gate.outputs.crawl == 'true' }}
        working-directory: ${{ github.workspace }}
        env:
          SITE_DIR: ${{ inputs.site-dir }}
          BETTER_AUTH_SECRET: ci-dummy-secret-ci-dummy-secret-32
          BETTER_AUTH_URL: http://127.0.0.1:4321
        run: |
          set -euo pipefail
          site="${GITHUB_WORKSPACE}/${SITE_DIR%/}"
          entry="$site/.amplify-hosting/compute/default/server/entry.mjs"
          test -f "$entry" || { echo "SSR entry not found at $entry"; exit 1; }
          # Boot the standalone server in the background. Sanity from job env renders the
          # public Sanity-backed pages; dummy better-auth lets it boot; NO DB needed —
          # middleware degrades a missing DB to anonymous, so public pages still render.
          HOST=127.0.0.1 PORT=4321 \
            PUBLIC_SANITY_PROJECT_ID="$PUBLIC_SANITY_PROJECT_ID" \
            PUBLIC_SANITY_DATASET="$PUBLIC_SANITY_DATASET" \
            node "$entry" & SRV=$!
          # Wait up to 60s for the port; bail early if the process dies.
