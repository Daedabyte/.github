          };

          // dist mode: serve the static build over a dependency-free http server.
          function serveDist(dist) {
            return createServer((req, res) => {
              try {
                const p = decodeURIComponent(new URL(req.url, 'http://x').pathname);
                let fp = join(dist, p);
